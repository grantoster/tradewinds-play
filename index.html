<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tradewinds</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tradewinds">
<meta name="theme-color" content="#2f86d6">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<script>window.TW_WEB=1</script>

<style>
@font-face{font-family:"Fredoka";src:url("fonts/Fredoka.ttf") format("truetype");font-weight:300 700;font-display:block}
@font-face{font-family:"Nunito";src:url("fonts/Nunito.ttf") format("truetype");font-weight:200 1000;font-display:block}
:root{
  --ink:#2a1e2e; --paper:#fff8e7; --paper2:#f3e6c6; --sea:#3b8fd6; --sea2:#2f6fb5; --sun:#ffd23f; --leaf:#4fae55; --muted:#6d6372; --plum:#5a4a8c;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#3f8fd2;color:var(--ink);font-family:"Nunito",ui-rounded,system-ui,sans-serif;font-weight:700;font-size:18px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;-webkit-user-select:text;user-select:text}
img{image-rendering:pixelated}
.muted{color:var(--muted)} .small{font-size:.8em} .center{text-align:center}
.row{display:flex;gap:10px;align-items:center;justify-content:center} .row.wrap{flex-wrap:wrap;justify-content:flex-start}
.btn{background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:10px 16px;box-shadow:0 4px 0 var(--ink);font-weight:600;min-height:48px;transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--sun)} .btn.big{font-size:1.1em;padding:12px 22px}
.btn.tiny{min-height:40px;padding:4px 10px;font-size:.85em;box-shadow:0 3px 0 var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
hr{border:0;border-top:2px dashed #d6c7a1;margin:12px 0}

/* ---------- screens ---------- */
#title,#game{position:fixed;inset:0;display:none}
#title.show,#game.show{display:block}
#title{background:linear-gradient(#8fd3ff 0%,#c9efff 55%,#3f8fd2 55%,#2f6fb5 100%);overflow:hidden}
#title-deco img{position:absolute;width:72px;left:-90px;animation:drift 18s linear infinite;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
@keyframes drift{from{transform:translateX(0) translateY(0)}50%{transform:translateX(60vw) translateY(-14px)}to{transform:translateX(calc(100vw + 180px)) translateY(0)}}
.logo{position:absolute;left:0;right:0;top:calc(12% + var(--safe-t));text-align:center}
.logo h1{font-size:clamp(54px,11vw,110px);margin:0;color:var(--sun);text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),0 10px 0 rgba(0,0,0,.2);letter-spacing:2px}
.logo p{margin:6px 0 0;font-size:clamp(16px,2.6vw,24px);color:var(--ink);font-weight:600}
#title-press{position:absolute;left:0;right:0;bottom:calc(18% + var(--safe-b));text-align:center}
#title-press.hide{display:none}
#title-press .btn{font-size:1.4em;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
#slots{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10% + var(--safe-b));display:none;flex-direction:column;gap:12px;width:min(460px,90vw)}
#slots.show{display:flex}
.slot-btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:12px 16px;box-shadow:0 5px 0 var(--ink)}
.slot-btn b{font-size:1.2em} .slot-btn span{font-size:.9em} .slot-btn small{color:var(--muted)}
.slot-btn.empty{background:#e9f6ff}
#btn-grownups{position:absolute;right:calc(14px + var(--safe-r));bottom:calc(14px + var(--safe-b));font-size:.8em}

#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + var(--safe-t)) calc(10px + var(--safe-r)) 0 calc(10px + var(--safe-l));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
#hud > *{pointer-events:auto}
.hud-left{display:flex;flex-direction:column;gap:6px;max-width:58%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:4px 10px;font-weight:600;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
#hud-shells{background:var(--sun)}
#hud-goal{background:rgba(255,248,231,.94);border:3px solid var(--ink);border-radius:10px;padding:5px 10px;font-size:.82em;box-shadow:0 3px 0 var(--ink);cursor:pointer}
.hud-right{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hb{width:54px;height:54px;border-radius:12px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:24px;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1;padding:0}
.hb small{font-size:10px;margin-top:2px;font-weight:600}
.hb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* ---------- dialogue ---------- */
#dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));width:min(920px,calc(100vw - 20px));background:var(--paper);border:4px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--ink);padding:14px 16px;display:none;gap:14px;align-items:flex-start;z-index:88;min-height:120px}
#dialog.show{display:flex}
#dialog.letter{background:#fdf3d8;font-style:italic}
#dialog.narrator{background:#e9f6ff}
#dialog .portrait{flex:0 0 auto;width:88px;height:88px;background:#bfe9ff;border:3px solid var(--ink);border-radius:10px;overflow:hidden}
#dialog .portrait canvas{width:100%;height:100%;image-rendering:pixelated}
#dialog .body{flex:1;min-width:0}
#dialog .who{display:inline-block;background:var(--sea);color:#fff;border:3px solid var(--ink);border-radius:8px;padding:1px 10px;font-weight:700;margin-bottom:6px}
#dialog .text{font-size:1.12em;line-height:1.35;min-height:2.7em;white-space:pre-line}
#dialog .next{position:absolute;right:16px;bottom:8px;visibility:hidden;animation:bob 0.8s infinite}
#dialog .choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.choice{background:var(--sun);border:3px solid var(--ink);border-radius:10px;padding:8px 14px;box-shadow:0 4px 0 var(--ink);font-weight:600;min-height:48px}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* ---------- panels ---------- */
#panels{position:fixed;inset:0;pointer-events:none;z-index:85}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 20px));max-height:calc(100vh - 24px - var(--safe-t) - var(--safe-b));display:flex;flex-direction:column;background:var(--paper);border:4px solid var(--ink);border-radius:16px;box-shadow:0 8px 0 var(--ink),0 0 0 100vmax rgba(20,15,40,.45);pointer-events:auto;animation:pop .15s ease-out}
@keyframes pop{from{transform:translate(-50%,-46%);opacity:.4}}
.panel.wide{width:min(1060px,calc(100vw - 20px))}
.panel.small{width:min(460px,calc(100vw - 20px))}
.panel.full{width:calc(100vw - 12px - var(--safe-l) - var(--safe-r));height:calc(100vh - 12px - var(--safe-t) - var(--safe-b));max-height:none}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 8px 18px;border-bottom:3px solid var(--ink);background:var(--paper2);border-radius:12px 12px 0 0}
.panel-head h2{margin:0;font-size:1.25em}
.x{width:46px;height:46px;border:3px solid var(--ink);border-radius:10px;background:var(--paper);font-size:20px;box-shadow:0 3px 0 var(--ink)}
.panel-body{padding:14px 16px 18px;overflow:auto;-webkit-overflow-scrolling:touch;flex:1}
.confirm p{font-size:1.1em;text-align:center}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.tab{background:var(--paper2);border:3px solid var(--ink);border-radius:10px;padding:6px 12px;font-weight:600;white-space:nowrap;min-height:44px}
.tab.on{background:var(--sea);color:#fff}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.tip{background:#e9f6ff;border:2px solid var(--sea);border-radius:10px;padding:8px 12px}

#toasts{position:fixed;top:calc(80px + var(--safe-t));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:89;pointer-events:none;width:min(520px,90vw)}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;text-align:center;transition:opacity .4s,transform .4s;font-weight:600}
.toast.good{background:var(--leaf)} .toast.out{opacity:0;transform:translateY(-8px)}
#fade{position:fixed;inset:0;background:#120c22;opacity:0;pointer-events:none;transition:opacity .45s;z-index:95}
#fade.on{opacity:1;pointer-events:auto}
#lockout{position:fixed;inset:0;background:linear-gradient(#20193f,#3d3168);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:99;text-align:center;padding:20px}
body.gate-over-lock #panels{z-index:100}
#lockout.show{display:flex}
#lockout h1{color:var(--sun);font-size:2.4em;margin:0}
#lockout .btn{color:var(--ink)}

/* ---------- cards ---------- */
.card{--cw:96px;width:var(--cw);height:calc(var(--cw) * 1.4);flex:0 0 auto;position:relative;background:var(--frame,#888);border:2px solid var(--ink);border-radius:calc(var(--cw) * .08);padding:calc(var(--cw) * .045);display:flex;flex-direction:column;box-shadow:0 3px 0 var(--ink);font-size:calc(var(--cw) * .118);line-height:1.1;overflow:hidden}
.card.sz-xs{--cw:62px} .card.sz-sm{--cw:84px} .card.sz-md{--cw:124px} .card.sz-lg{--cw:230px}
.card.tap{cursor:pointer} .card.tap:active{transform:scale(.97)}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:2px;background:var(--paper);border-radius:4px;padding:1px 3px;font-weight:700}
.cname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cpow{flex:0 0 auto;background:var(--ink);color:#fff;border-radius:999px;min-width:1.5em;text-align:center;padding:0 .2em}
.cart{flex:1;min-height:0;margin:5% 0;background:var(--light);border:2px solid rgba(42,30,46,.35);border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.cart .art{width:88%;max-height:100%;object-fit:contain}
.cmeta{display:flex;justify-content:space-between;align-items:center;background:var(--paper);border-radius:4px;padding:1px 3px;font-size:.82em}
.cgems{letter-spacing:-1px}
.r-C .cgems{color:#8a939d} .r-U .cgems{color:#3e9b4f} .r-R .cgems{color:#2f7fd0} .r-E .cgems{color:#8b4fd6} .r-M .cgems{color:#d9952a}
.cabil{background:var(--paper);border-radius:4px;margin-top:4%;padding:2px 4px;font-size:.62em;line-height:1.2}
.cabil.short{font-size:.72em;text-align:center;font-weight:600}
.cflavor{font-size:.55em;font-style:italic;margin-top:3%;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4);line-height:1.2}
.cprint{position:absolute;top:24%;left:9%;background:var(--sun);border:1px solid var(--ink);border-radius:3px;font-size:.62em;padding:0 3px;font-weight:700;z-index:2}
.cnum{position:absolute;bottom:2px;left:4px;font-size:.6em;color:#fff;text-shadow:0 1px 0 var(--ink);z-index:3}
.cbadge{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:1px 7px;font-size:.78em;font-weight:700;white-space:nowrap;z-index:4}
.cfoil{position:absolute;inset:0;pointer-events:none;border-radius:inherit}
.f-holo .cfoil{background:linear-gradient(115deg,transparent 25%,rgba(255,80,200,.32) 38%,rgba(80,255,255,.32) 50%,rgba(255,255,90,.32) 62%,transparent 75%);background-size:300% 300%;animation:holo 3.2s linear infinite;mix-blend-mode:screen}
.f-shimmer .cfoil{background:linear-gradient(115deg,transparent 15%,rgba(255,80,200,.45) 30%,rgba(80,255,255,.45) 45%,rgba(255,255,90,.45) 60%,rgba(140,120,255,.45) 75%,transparent 90%);background-size:300% 300%;animation:holo 1.8s linear infinite;mix-blend-mode:screen}
.f-shimmer .art{animation:bob 1.2s ease-in-out infinite}
.f-shimmer{box-shadow:0 3px 0 var(--ink),0 0 14px 2px rgba(255,230,120,.9)}
@keyframes holo{from{background-position:0% 50%}to{background-position:300% 50%}}
.c-good .cart::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 22%,rgba(255,255,255,.7) 0 2%,transparent 3%),radial-gradient(circle at 80% 70%,rgba(255,255,255,.6) 0 2%,transparent 3%);pointer-events:none}
.c-worn .cart{filter:saturate(.55) sepia(.25)}
.c-worn .cart::after{content:"";position:absolute;inset:0;background:linear-gradient(35deg,transparent 48%,rgba(255,255,255,.55) 49% 50%,transparent 51%),linear-gradient(-20deg,transparent 60%,rgba(255,255,255,.45) 61% 62%,transparent 63%);pointer-events:none}
.c-worn{border-style:dashed}
.csleeve{position:absolute;inset:-1px;border-radius:inherit;border:3px solid rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px rgba(42,30,46,.3);pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.28),transparent 35%)}
.card.sel{outline:4px solid var(--sun);outline-offset:2px;transform:translateY(-6px)}
.card.dim{opacity:.45}
.card.sil{background:#7d7787} .card.sil .cart{background:#d8d4de}
.card.back{background:repeating-linear-gradient(45deg,#2f6fb5 0 8px,#3b8fd6 8px 16px);align-items:center;justify-content:center}
.back-logo{background:var(--sun);border:3px solid var(--ink);border-radius:999px;width:56%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:2.2em;font-weight:700}
.card.locked{background:#4a4458;color:#fff;align-items:center;justify-content:center;gap:6px;text-align:center}
.lockicon{font-size:2.2em}
.newtag{position:absolute;top:-2px;right:-2px;background:var(--leaf);color:#fff;border:2px solid var(--ink);border-radius:6px;font-size:.7em;padding:0 4px;font-weight:700;z-index:5}
.flipin{animation:flip .35s ease-out}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
.glowpop{box-shadow:0 3px 0 var(--ink),0 0 20px 6px rgba(255,220,90,.95)}

.strip{display:flex;gap:10px;overflow-x:auto;padding:8px 4px 10px;-webkit-overflow-scrolling:touch}
.strip.wrap{flex-wrap:wrap;overflow:visible}
.forsale{display:flex;flex-direction:column;align-items:center;gap:4px;width:104px;text-align:center}
.forsale small{font-size:.7em;line-height:1.1;min-height:2.2em}

/* ---------- trade ---------- */
.trade-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.trade-top .who{display:flex;gap:10px;align-items:center}
.trade-top .who canvas{width:56px;height:56px;border:3px solid var(--ink);border-radius:8px;background:#bfe9ff;image-rendering:pixelated}
.trade-top .who small{display:block;color:var(--muted)}
.moods{display:flex;gap:8px;flex-wrap:wrap}
.mood{display:flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:12px;padding:6px 12px;background:var(--paper2);font-weight:700}
.mood .face{font-size:30px}
.mood.m-angry{background:#ffd9cf} .mood.m-unsure{background:#fff1bf} .mood.m-happy{background:#d6f5d0} .mood.m-thrilled{background:#b7f0ae}
.trade-sides{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin:12px 0;align-items:stretch}
.swap{align-self:center;font-size:30px}
.side{border:3px dashed #c8b88f;border-radius:12px;padding:8px 10px;background:#fffdf5;display:flex;flex-direction:column;gap:6px;min-width:0}
.side h3,.pick-col h3{margin:0;font-size:1em}
.side-cards{display:flex;gap:8px;flex-wrap:wrap;min-height:122px;align-items:flex-start}
.stepper{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stepper b{min-width:64px;text-align:center}
.trade-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick-col{min-width:0;border-top:3px solid var(--paper2);padding-top:6px}
.pick-col .strip{flex-wrap:wrap;max-height:300px;overflow:auto}
.trade-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px;position:sticky;bottom:-18px;background:var(--paper);padding:8px 0}

/* ---------- shops & places ---------- */
.keeper{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.keeper canvas{width:64px;height:64px;border:3px solid var(--ink);border-radius:10px;background:#bfe9ff;image-rendering:pixelated;flex:0 0 auto}
.keeper p{margin:2px 0 0;font-size:.9em}
.shop-row{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.pack{width:220px;border:4px solid var(--ink);border-radius:14px;background:var(--frame);padding:10px;box-shadow:0 6px 0 var(--ink);color:#fff;text-align:center}
.pack-name{font-weight:700;font-size:1.15em;text-shadow:2px 2px 0 var(--ink)}
.pack-art{width:110px;margin:8px auto;display:block;opacity:.9}
.odds{background:var(--paper);color:var(--ink);border-radius:8px;padding:6px;font-size:.72em;text-align:left;line-height:1.35}
.shop-actions{flex:1;min-width:220px}
.reveal-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0;perspective:600px}
.board h3{margin:8px 0 6px}
.movers{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mover{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed #d6c7a1}
.mover img{width:36px;height:36px;background:#e9f6ff;border-radius:6px}
.mover span:nth-child(2){flex:1}
.up{color:#2e8b3a} .down{color:#b0522a}
.jobgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:12px auto}
.hole{aspect-ratio:1;border:3px solid var(--ink);border-radius:50%;background:radial-gradient(#6b4a2e 0 45%,#a8794c 46%);font-size:clamp(28px,6vw,48px);box-shadow:inset 0 6px 0 rgba(0,0,0,.25)}
.hole.hit{background:radial-gradient(#ffd23f 0 45%,#a8794c 46%)} .hole.ouch{background:radial-gradient(#ff9a7a 0 45%,#a8794c 46%)}
.jobinfo{display:flex;justify-content:center;gap:30px;font-size:1.4em;font-weight:700}

/* ---------- binder & journal ---------- */
.page{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px;justify-items:center;padding:12px;border-radius:14px;background:#efe3c4;border:3px solid #d6c7a1}
.page.gold{border:5px solid #f0b43c;box-shadow:0 0 18px rgba(240,180,60,.7)}
.page-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.future{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.fut{border:3px solid var(--ink);border-radius:12px;padding:12px;background:var(--frame);color:#fff;display:flex;flex-direction:column;gap:4px;opacity:.75}
.big{font-size:2em}
.detail{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.detail-info{flex:1;min-width:240px}
.detail-info h3{margin-top:0}
.price{background:#e9f6ff;border-radius:10px;padding:8px 12px;font-weight:600}
.goal{background:#fff1bf;border:3px solid var(--ink);border-radius:12px;padding:10px 14px}
.rep{display:grid;grid-template-columns:110px 1fr 110px;gap:10px;align-items:center;margin:6px 0}
.bar{height:14px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff}
.bar i{display:block;height:100%;background:var(--leaf)}
.tlog{display:flex;flex-direction:column;gap:8px}
.tl{border:2px solid #d6c7a1;border-radius:10px;padding:8px 10px;background:#fffdf5}
.net{font-weight:700;margin-top:2px}
.letter-card{background:#fdf3d8;border:2px solid #d6c7a1;border-radius:10px;padding:8px 14px;margin-bottom:10px;font-style:italic}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stamp{border:3px dashed #b9ad8f;border-radius:50%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#a99f86}
.stamp.got{border:4px solid var(--ink);background:var(--frame);color:#fff;transform:rotate(-6deg)}
.deckrow{min-height:126px;background:#e9f6ff;border-radius:12px;padding:8px}

  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }

function hexToHsl(hex) {
  const n = parseInt(hex.slice(1), 16); let r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0; const l = (mx + mn) / 2;

  return [h * 360, s, l];
}
function hslToHex(h, s, l) {

  const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const to = v => Math.round(v * 255).toString(16).padStart(2, "0");
  return "#" + (s === 0 ? to(l) + to(l) + to(l) : to(f(h + 1 / 3)) + to(f(h)) + to(f(h - 1 / 3)));
}

function finishLayer(layer, outline, width, shade = true, light = [0.36, 0.28]) {
  const w = layer.width, h = layer.height, g = layer.getContext("2d");

    gr.addColorStop(0, "rgba(255,255,255,0.42)"); gr.addColorStop(0.38, "rgba(255,255,255,0)");
    gr.addColorStop(0.66, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(40,20,70,0.34)");

// A vector pen that understands the 24-unit creature grid
class VG {
  constructor(g, k, pal) { this.g = g; this.k = k; this.pal = pal; }
  col(c) { return c == null ? null : (this.pal[c] || c); }
  paint(c, fn) {
    const g = this.g, col = this.col(c);
    g.save(); if (!col) { g.globalCompositeOperation = "destination-out"; g.fillStyle = "#000"; g.strokeStyle = "#000"; } else { g.fillStyle = col; g.strokeStyle = col; }
    fn(g); g.restore();

  rect(x, y, w, h, c) { const k = this.k; this.paint(c, g => { g.beginPath(); g.roundRect(x * k, y * k, w * k, h * k, Math.min(w, h) * k * 0.35); g.fill(); }); }
  ell(cx, cy, rx, ry, c) { const k = this.k; this.paint(c, g => { g.beginPath(); g.ellipse(cx * k, cy * k, Math.max(0.3, rx + 0.25) * k, Math.max(0.3, ry + 0.25) * k, 0, 0, Math.PI * 2); g.fill(); }); }
  tri(x1, y1, x2, y2, x3, y3, c) { const k = this.k; this.paint(c, g => { g.beginPath(); g.moveTo(x1 * k, y1 * k); g.lineTo(x2 * k, y2 * k); g.lineTo(x3 * k, y3 * k); g.closePath(); g.lineJoin = "round"; g.lineWidth = k * 0.6; g.fill(); g.stroke(); }); }

}

      // arms

      if (!side) { fill(o.shirt, () => { g.ellipse(19, 42 + sw * 0.4, 4.2, 6.5, 0.25, 0, 7); g.ellipse(45, 42 - sw * 0.4, 4.2, 6.5, -0.25, 0, 7); }); fill(o.skin, () => { g.arc(18, 48 + sw * 0.4, 3.4, 0, 7); g.arc(46, 48 - sw * 0.4, 3.4, 0, 7); }); }

function shadowAt(g, cx, cy, rx, ry = rx * 0.35) { g.fillStyle = "rgba(25,40,40,0.22)"; g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, 7); g.fill(); }
function blob(g, cx, cy, rad, c1, c2) { const gr = g.createRadialGradient(cx - rad * 0.35, cy - rad * 0.4, rad * 0.1, cx, cy, rad); gr.addColorStop(0, c1); gr.addColorStop(1, c2); g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, rad, 0, 7); g.fill(); }
function drawDeco(g, k, x, y, frame, key) {
  const X = x * RT, Y = y * RT, cx = X + RT / 2, cy = Y + RT / 2;
  const rr = rngFor("deco", key, x, y);
  switch (k) {
    case "tree":
      shadowAt(g, cx, Y + RT - 6, 20);
      g.fillStyle = "#8a5a36"; g.beginPath(); g.roundRect(cx - 5, Y + 24, 10, 20, 4); g.fill();
      blob(g, cx - 10, Y + 18, 14, "#6fd06a", "#2f8f45"); blob(g, cx + 10, Y + 18, 14, "#6fd06a", "#2f8f45"); blob(g, cx, Y + 6, 17, "#86e07a", "#33964a");
      g.fillStyle = "rgba(255,255,255,.35)"; g.beginPath(); g.ellipse(cx - 6, Y, 6, 3.5, -0.4, 0, 7); g.fill();
      break;
    case "bush":
      shadowAt(g, cx, Y + RT - 8, 18);
      blob(g, cx - 8, cy + 6, 12, "#74d36a", "#2f8f45"); blob(g, cx + 8, cy + 6, 12, "#74d36a", "#2f8f45"); blob(g, cx, cy - 2, 13, "#86e07a", "#33964a");
      g.fillStyle = "#ff6f91"; for (const [dx, dy] of [[-8, 4], [6, -4], [9, 9]]) { g.beginPath(); g.arc(cx + dx, cy + dy, 3, 0, 7); g.fill(); }
      break;
    case "pine":
      shadowAt(g, cx, Y + RT - 6, 16);
      g.fillStyle = "#7a5032"; g.beginPath(); g.roundRect(cx - 4, Y + 32, 8, 14, 3); g.fill();
      for (let i = 0; i < 3; i++) { const w = 22 - i * 5, top = Y - 10 + i * 13; const gr = g.createLinearGradient(cx - w, 0, cx + w, 0); gr.addColorStop(0, "#4fb06a"); gr.addColorStop(1, "#22704a"); g.fillStyle = gr; g.beginPath(); g.moveTo(cx, top); g.quadraticCurveTo(cx + w * 0.5, top + 14, cx + w, top + 24); g.quadraticCurveTo(cx, top + 30, cx - w, top + 24); g.quadraticCurveTo(cx - w * 0.5, top + 14, cx, top); g.fill(); }
      break;
    case "palm":
      shadowAt(g, cx + 6, Y + RT - 6, 16);
      g.strokeStyle = "#a06c3f"; g.lineWidth = 8; g.lineCap = "round"; g.beginPath(); g.moveTo(cx - 4, Y + RT - 6); g.quadraticCurveTo(cx - 2, cy, cx + 6, Y + 6); g.stroke();
      g.strokeStyle = "rgba(0,0,0,.15)"; g.lineWidth = 2; for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(cx - 6, Y + 38 - i * 8); g.lineTo(cx + 2, Y + 36 - i * 8); g.stroke(); }
      for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + (i - 2.5) * 0.75; const ex = cx + 6 + Math.cos(a) * 26, ey = Y + 8 + Math.sin(a) * 16 + 8; g.fillStyle = i % 2 ? "#47b85a" : "#5fd06c"; g.beginPath(); g.moveTo(cx + 6, Y + 6); g.quadraticCurveTo((cx + 6 + ex) / 2, Y - 10, ex, ey); g.quadraticCurveTo((cx + 6 + ex) / 2, Y + 4, cx + 6, Y + 8); g.fill(); }
      g.fillStyle = "#7a4a28"; g.beginPath(); g.arc(cx + 3, Y + 10, 4, 0, 7); g.arc(cx + 10, Y + 11, 4, 0, 7); g.fill();
      break;
    case "rock":
      shadowAt(g, cx, Y + RT - 8, 18);
      { const gr = g.createLinearGradient(0, Y + 10, 0, Y + 44); gr.addColorStop(0, "#c9c6c1"); gr.addColorStop(1, "#8a8680"); g.fillStyle = gr; g.beginPath(); g.ellipse(cx, cy + 6, 19, 15, 0, 0, 7); g.fill(); }
      g.fillStyle = "rgba(255,255,255,.5)"; g.beginPath(); g.ellipse(cx - 7, cy - 1, 6, 3, -0.4, 0, 7); g.fill();
      break;
    case "fence":
      g.fillStyle = "#d9a56a"; g.beginPath(); g.roundRect(X, Y + 18, RT, 6, 3); g.roundRect(X, Y + 30, RT, 6, 3); g.fill();
      for (const px of [X + 8, X + 34]) { g.fillStyle = "#b9824a"; g.beginPath(); g.roundRect(px, Y + 10, 8, 32, 3); g.fill(); g.fillStyle = "#e7bb84"; g.fillRect(px + 1, Y + 11, 3, 28); }
      break;
    case "sign":
      shadowAt(g, cx, Y + RT - 6, 14);
      g.fillStyle = "#8a5a36"; g.beginPath(); g.roundRect(cx - 3, Y + 22, 6, 22, 3); g.fill();
      g.fillStyle = "#d9a56a"; g.beginPath(); g.roundRect(X + 6, Y + 6, RT - 12, 22, 6); g.fill();
      g.strokeStyle = "#9a6a3a"; g.lineWidth = 2.5; g.stroke();
      g.fillStyle = "#9a6a3a"; g.fillRect(X + 13, Y + 13, RT - 26, 2.5); g.fillRect(X + 13, Y + 19, RT - 32, 2.5);
      break;
    case "flowers":
      for (let i = 0; i < 4; i++) {
        const fx = X + 8 + rr() * 32, fy = Y + 8 + rr() * 32, col = pick(rr, ["#ff7fa3", "#ffd23f", "#ffffff", "#b48cff", "#ff9d5c"]);
        g.fillStyle = col; for (let p = 0; p < 5; p++) { const a = p / 5 * Math.PI * 2; g.beginPath(); g.arc(fx + Math.cos(a) * 3.2, fy + Math.sin(a) * 3.2, 2.6, 0, 7); g.fill(); }
        g.fillStyle = "#ffcf33"; g.beginPath(); g.arc(fx, fy, 2, 0, 7); g.fill();
      }
      break;
    case "tall": {
      // the classic tall-grass patch
      for (let row = 0; row < 3; row++) for (let i = 0; i < 4; i++) {
        const bx = X + 4 + i * 11 + (row % 2) * 5, by = Y + 18 + row * 12;
        const gr = g.createLinearGradient(0, by - 18, 0, by); gr.addColorStop(0, "#5ed65a"); gr.addColorStop(1, "#23863f");
        g.fillStyle = gr; g.beginPath(); g.moveTo(bx - 2, by); g.quadraticCurveTo(bx - 1, by - 10, bx + 2, by - 18); g.quadraticCurveTo(bx + 4, by - 8, bx + 6, by - 15); g.quadraticCurveTo(bx + 7, by - 6, bx + 10, by); g.closePath(); g.fill();
      }
      break;
    }
    case "dock": {
      g.fillStyle = "rgba(20,50,90,.25)"; g.fillRect(X + 4, Y + 6, RT - 8, RT);
      for (let i = 0; i < 4; i++) { const py = Y + i * 12; const gr = g.createLinearGradient(0, py, 0, py + 11); gr.addColorStop(0, "#d6a26c"); gr.addColorStop(1, "#a8723f"); g.fillStyle = gr; g.beginPath(); g.roundRect(X + 4, py + 1, RT - 8, 10, 3); g.fill(); }
      g.fillStyle = "#7a4e2a"; for (const px of [X + 4, X + RT - 10]) { g.beginPath(); g.roundRect(px, Y + 30, 6, 18, 2); g.fill(); }
      break;
    }
    case "pool":
      g.fillStyle = "#c9b27a"; g.beginPath(); g.ellipse(cx, cy + 3, 18, 12, 0, 0, 7); g.fill();
      { const gr = g.createRadialGradient(cx - 4, cy - 2, 2, cx, cy, 16); gr.addColorStop(0, "#9fe7ff"); gr.addColorStop(1, "#3b9be0"); g.fillStyle = gr; g.beginPath(); g.ellipse(cx, cy + 1, 15, 9.5, 0, 0, 7); g.fill(); }
      g.fillStyle = "#ff8fab"; g.beginPath(); g.arc(cx + 7, cy + 2, 2.5, 0, 7); g.fill();
      break;
    case "vent":
      g.fillStyle = "#4a3f3d"; g.beginPath(); g.ellipse(cx, cy + 10, 12, 6, 0, 0, 7); g.fill();
      g.fillStyle = "rgba(240,244,248,.85)"; for (const [dx, dy, rad] of [[0, -2, 7], [-5 + frame * 3, -12, 6], [4 - frame * 3, -20, 5]]) { g.beginPath(); g.arc(cx + dx, cy + dy, rad, 0, 7); g.fill(); }
      break;
  }
}

// ---------- buildings ----------
function drawBuilding(g, b) {
  const x = b.x * RT, y = b.y * RT, w = b.w * RT, h = b.h * RT;
  const roof = b.roof || "#e05d47", wall = b.wall || "#fff1d6", k = b.kind;
  shadowAt(g, x + w / 2, y + h - 2, w * 0.55, 12);
  const grad = (y0, y1, a, c) => { const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, a); gr.addColorStop(1, c); return gr; };
  if (k === "lighthouse") {
    g.fillStyle = grad(y + 20, y + h, "#ffffff", "#e3e7ee"); g.beginPath(); g.moveTo(x + 18, y + 26); g.lineTo(x + w - 18, y + 26); g.lineTo(x + w - 8, y + h - 4); g.quadraticCurveTo(x + w / 2, y + h + 4, x + 8, y + h - 4); g.closePath(); g.fill();
    g.save(); g.clip(); g.fillStyle = "#e9574a"; for (let i = 0; i < 3; i++) g.fillRect(x, y + 52 + i * 46, w, 20); g.restore();
    g.fillStyle = "#3a3f55"; g.beginPath(); g.roundRect(x + 10, y + 18, w - 20, 10, 4); g.fill();
    g.fillStyle = "#fff3a6"; g.beginPath(); g.roundRect(x + 20, y, w - 40, 20, 5); g.fill();
    g.fillStyle = "rgba(255,240,150,.45)"; g.beginPath(); g.arc(x + w / 2, y + 10, 26, 0, 7); g.fill();
    g.fillStyle = roof; g.beginPath(); g.moveTo(x + 16, y + 2); g.quadraticCurveTo(x + w / 2, y - 26, x + w - 16, y + 2); g.fill();
  } else if (k === "windmill") {
    g.fillStyle = grad(y, y + h, "#fff4dd", "#e2cfae"); g.beginPath(); g.moveTo(x + 22, y + 24); g.lineTo(x + w - 22, y + 24); g.lineTo(x + w - 10, y + h - 4); g.quadraticCurveTo(x + w / 2, y + h + 6, x + 10, y + h - 4); g.closePath(); g.fill();
    g.fillStyle = roof; g.beginPath(); g.moveTo(x + 14, y + 30); g.quadraticCurveTo(x + w / 2, y - 18, x + w - 14, y + 30); g.closePath(); g.fill();
    g.fillStyle = "#9fdcf5"; g.beginPath(); g.roundRect(x + w / 2 - 9, y + 60, 18, 18, 9); g.fill();
  } else if (k === "stall") {
    g.fillStyle = grad(y + 30, y + h, "#c89566", "#9a6a3e"); g.beginPath(); g.roundRect(x + 6, y + 34, w - 12, h - 36, 8); g.fill();
    g.fillStyle = "#7a4e2a"; g.fillRect(x + 8, y + 18, 6, h - 22); g.fillRect(x + w - 14, y + 18, 6, h - 22);
    for (let i = 0; i < 6; i++) { g.fillStyle = i % 2 ? "#ffffff" : roof; g.beginPath(); g.moveTo(x + i * w / 6, y + 6); g.lineTo(x + (i + 1) * w / 6, y + 6); g.lineTo(x + (i + 1) * w / 6, y + 26); g.arc(x + (i + 0.5) * w / 6, y + 26, w / 12, 0, Math.PI); g.closePath(); g.fill(); }
    g.fillStyle = "rgba(0,0,0,.1)"; g.fillRect(x, y + 6, w, 4);
  } else if (k === "board") {
    g.fillStyle = "#8a5a36"; g.beginPath(); g.roundRect(x + 10, y + 26, 8, h - 28, 3); g.roundRect(x + w - 18, y + 26, 8, h - 28, 3); g.fill();
    g.fillStyle = "#b9824a"; g.beginPath(); g.roundRect(x + 2, y + 2, w - 4, 52, 8); g.fill();
    g.fillStyle = "#3f6b52"; g.beginPath(); g.roundRect(x + 8, y + 8, w - 16, 40, 5); g.fill();
    const cols = ["#fff8d6", "#ffe1ea", "#e3f4ff", "#fff8d6"]; for (let i = 0; i < 4; i++) { g.fillStyle = cols[i]; g.beginPath(); g.roundRect(x + 14 + (i % 2) * 34, y + 12 + Math.floor(i / 2) * 18, 26, 14, 2); g.fill(); }
  } else {
    const roofH = Math.min(h - 26, Math.max(42, Math.floor(h * 0.48)));
    g.fillStyle = grad(y + roofH, y + h, wall, shiftHex(wall, 0, 0, -0.08)); g.beginPath(); g.roundRect(x + 6, y + roofH - 6, w - 12, h - roofH + 4, 8); g.fill();
    // roof: rounded, overhanging
    g.fillStyle = grad(y, y + roofH, shiftHex(roof, 0, 0, 0.08), shiftHex(roof, 0, 0, -0.1)); g.beginPath(); g.roundRect(x - 4, y + 4, w + 8, roofH, [18, 18, 10, 10]); g.fill();
    g.fillStyle = "rgba(255,255,255,.25)"; g.beginPath(); g.roundRect(x + 4, y + 8, w - 8, 8, 4); g.fill();
    g.fillStyle = "rgba(0,0,0,.12)"; for (let i = y + 24; i < y + roofH - 6; i += 12) g.fillRect(x, i, w, 2);
    // windows
    if (b.w >= 3) for (const wx of [x + 18, x + w - 42]) {
      g.fillStyle = "#ffffff"; g.beginPath(); g.roundRect(wx - 3, y + roofH + 7, 30, 26, 7); g.fill();
      g.fillStyle = grad(y + roofH, y + roofH + 30, "#bfeaff", "#6cbfe8"); g.beginPath(); g.roundRect(wx, y + roofH + 10, 24, 20, 5); g.fill();
      g.fillStyle = "rgba(255,255,255,.7)"; g.beginPath(); g.roundRect(wx + 3, y + roofH + 12, 6, 8, 3); g.fill();
    }
    if (k === "shop" || k === "hall") { g.fillStyle = b.sign || "#3b8fd6"; g.beginPath(); g.roundRect(x + w / 2 - 38, y + roofH - 20, 76, 22, 11); g.fill(); g.fillStyle = "#fff"; g.beginPath(); g.roundRect(x + w / 2 - 26, y + roofH - 13, 52, 3, 2); g.roundRect(x + w / 2 - 20, y + roofH - 7, 40, 3, 2); g.fill(); }
    if (k === "inn") { g.fillStyle = "#ffd23f"; g.beginPath(); g.arc(x + w / 2, y + roofH - 10, 10, 0, 7); g.fill(); g.fillStyle = "#7a4e2a"; g.font = "bold 13px sans-serif"; g.textAlign = "center"; g.fillText("Z", x + w / 2, y + roofH - 5); }
  }
  if (b.door) {
    const dx = b.door[0] * RT, dy = b.door[1] * RT;
    g.fillStyle = "#7a4a28"; g.beginPath(); g.roundRect(dx + 11, dy + 10, 26, 38, [13, 13, 2, 2]); g.fill();
    g.fillStyle = "#9a6238"; g.beginPath(); g.roundRect(dx + 14, dy + 14, 20, 34, [10, 10, 2, 2]); g.fill();
    g.fillStyle = "#ffd23f"; g.beginPath(); g.arc(dx + 30, dy + 32, 2.5, 0, 7); g.fill();
    g.fillStyle = "rgba(0,0,0,.15)"; g.fillRect(dx + 8, dy + 46, 32, 3);
  }
}
function drawWindmillBlades(g, b, t, ox, oy, s) {
  const u = s * T / RT; // screen pixels per painted pixel
  const cx = (b.x * RT + b.w * RT / 2) * u - ox, cy = (b.y * RT + 26) * u - oy;
  g.save(); g.translate(cx, cy); g.rotate(t / 900);
  for (let i = 0; i < 4; i++) {
    g.rotate(Math.PI / 2);
    g.fillStyle = "#fbf6ea"; g.strokeStyle = "#9a7a55"; g.lineWidth = 2 * u;
    g.beginPath(); g.roundRect(-7 * u, 6 * u, 14 * u, 60 * u, 5 * u); g.fill(); g.stroke();
    g.strokeStyle = "rgba(154,122,85,.5)"; g.beginPath(); for (let j = 1; j < 5; j++) { g.moveTo(-7 * u, (6 + j * 12) * u); g.lineTo(7 * u, (6 + j * 12) * u); } g.stroke();
  }
  g.fillStyle = "#8a5a36"; g.beginPath(); g.arc(0, 0, 8 * u, 0, 7); g.fill();
  g.restore();
}

const ISLAND_ORDER = ["driftwood", "cinderpeak", "galehollow"];

function buildIslandGrid(key) {
  const isl = ISLANDS[key];
  const H = isl.map.length, W = isl.map[0].length;
  const grid = [];
  for (let y = 0; y < H; y++) { const row = []; for (let x = 0; x < W; x++) row.push(LEGEND[isl.map[y][x]] || "water"); grid.push(row); }
  const block = Array.from({ length: H }, (_, y) => Array.from({ length: W }, (_, x) => !TILE_DEFS[grid[y][x]].walk));
  for (const b of isl.buildings) for (let j = 0; j < b.h; j++) for (let i = 0; i < b.w; i++) if (block[b.y + j]) block[b.y + j][b.x + i] = true;
  return { W, H, grid, block };
}

const STORE_KEY = "tradewinds.v1";
let STORE = null;   // whole stored object
let S = null;       // the save being played
let SLOT = -1;

function freshStore() {
  return { v: 1, slots: [null, null, null], backups: [null, null, null],
    parent: { limitMin: 0, bedtime: "", sound: true, music: true, textSpeed: "normal" },
    usage: { date: "", secs: 0 } };
}
function loadStore() {
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) {}
  if (!raw && window.__twSaved) raw = window.__twSaved;
  try { STORE = raw ? JSON.parse(raw) : null; } catch (e) { STORE = null; }
  if (STORE && window.__twSaved && raw !== window.__twSaved) { try { const o = JSON.parse(window.__twSaved); if ((o.writtenAt || 0) > (STORE.writtenAt || 0) && o.slots) STORE = o; } catch (e) {} }
  if ((!STORE || !STORE.slots) && window.__twSaved && raw !== window.__twSaved) { try { STORE = JSON.parse(window.__twSaved); } catch (e) { STORE = null; } }
  if (!STORE || !STORE.slots) STORE = freshStore();
  STORE.parent = Object.assign(freshStore().parent, STORE.parent || {});
  STORE.usage = STORE.usage || { date: "", secs: 0 };
  STORE.backups = STORE.backups || [null, null, null];
}
let _saveTimer = null;
// A second copy of everything in IndexedDB, so a save survives even if one browser store is cleared.
function idb(mode, fn) {
  return new Promise(res => {
    try {
      const rq = indexedDB.open("tradewinds", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("kv");
      rq.onerror = () => res(null);
      rq.onsuccess = () => { try { const tx = rq.result.transaction("kv", mode); const r = fn(tx.objectStore("kv")); tx.oncomplete = () => res(r && r.result !== undefined ? r.result : null); tx.onerror = () => res(null); } catch (e) { res(null); } };
    } catch (e) { res(null); }
  });
}
async function preloadStore() {
  let ls = null; try { ls = localStorage.getItem(STORE_KEY); } catch (e) {}
  const db = await Promise.race([idb("readonly", s => s.get("store")), sleep(1500).then(() => null)]);

// ---------- the market ----------
function initMarket() {
  const r = rngFor(S.market.seed, "init");
  for (const id in SPECIES) { const d = 1 + (r() - 0.5) * 0.3; S.market.demand[id] = d; S.market.prev[id] = d; }
}
function printMult(c) { if (!c.p) return 1; return c.p === "fw" ? 1.5 : 4; }
function islandMult(sp, island) {
  if (sp.set === "heirloom") return 1;
  return SETS[sp.set].island === island ? 0.8 : 1.2;
}
function eventMult(sp, c, island) {
  let m = 1;
  for (const e of S.market.events) {
    if (e.island !== "all" && e.island !== island) continue;
    if (e.kind === "type" && e.type === sp.type) m *= e.mult;
    if (e.kind === "rarity" && e.rarities.includes(sp.rarity)) m *= e.mult;
    if (e.kind === "finish" && c && c.f !== "normal") m *= e.mult;
    if (e.kind === "ability" && sp.ability) m *= e.mult;
    if (e.kind === "set" && e.set === sp.set) m *= e.mult;
  }

}
// True market value of a card instance on an island, in whole Shells.
function cardValue(c, island = S.island) {

  const sp = SPECIES[c.s];
  const v = RARITY[sp.rarity].base * FINISH[c.f].mult * COND[c.c].mult * printMult(c)
    * (S.market.demand[c.s] || 1) * islandMult(sp, island) * eventMult(sp, c, island);
  return Math.max(1, roundHalf(v));
}

function nudgeDemand(sid, mult) { S.market.demand[sid] = clamp((S.market.demand[sid] || 1) * mult, 0.5, 3); }

const EVENT_POOL = [
  r => { const t = pick(r, ["tide", "ember", "gale", "bloom", "stone", "spark", "shade", "glow"]); const isl = pick(r, ISLAND_ORDER);
    return { kind: "type", type: t, island: isl, mult: 1.35, text: `${pick(r, ["A big storm", "A school field trip", "A Tide Clash club", "A traveling collector"])} has ${ISLANDS[isl].name} hunting for ${TYPES[t].name} cards. Prices there are up!` }; },
  r => { const isl = pick(r, ISLAND_ORDER), t = ISLANDS[isl].type;
    return { kind: "type", type: t, island: isl, mult: 0.75, text: `Somebody found a whole crate of ${TYPES[t].name} cards on ${ISLANDS[isl].name}. Prices there have dropped.` }; },
  () => ({ kind: "rarity", rarities: ["E", "M"], island: "all", mult: 1.25, text: "The Hoarders are on a buying spree! Epic and Mythic cards are up everywhere." }),
  r => { const isl = pick(r, ISLAND_ORDER); return { kind: "finish", island: isl, mult: 1.3, text: `Shiny fever on ${ISLANDS[isl].name}! Holo and Shimmer cards are up there.` }; },
  () => ({ kind: "ability", island: "all", mult: 1.15, text: "Tide Clash is the craze this week. Cards with abilities are worth more everywhere." }),
  r => { const isl = pick(r, ISLAND_ORDER); return { kind: "set", set: isl, island: "all", mult: 1.2, text: `A magazine called the ${ISLANDS[isl].name} set "the cutest ever." Its cards are up everywhere.` }; },

function newDayMarket() {

const PACK_PRICE = 90, PACK_LIMIT = 3, SLEEVE_PRICE = 25;

function rollCard(r, setKey, rarOdds, opts = {}) {
  const rar = weighted(r, Object.entries(rarOdds));
  const pool = speciesOf(setKey).filter(s => s.rarity === rar);
  const sp = pick(r, pool.length ? pool : speciesOf(setKey));
  const f = opts.normalOnly ? "normal" : weighted(r, Object.entries(FINISH_ODDS));
  const c = opts.cond || weighted(r, [["mint", 88], ["good", 12]]);
  let p = null;

}
function openPack(setKey) {

  const out = [];
  for (let i = 0; i < 4; i++) out.push(rollCard(r, setKey, PACK_ODDS));

// ---------- NPC state + valuation ----------
function npcState(id) {

  if (!S.npc[id]) {
    S.npc[id] = { met: false, stock: [], shells: n.shells || 0, lowballs: 0, madDay: 0, lastWin: 0, seen: 0, chat: 0 };
    if (n.stock && n.stock.n) {

      for (let i = 0; i < n.stock.n; i++) S.npc[id].stock.push(rollCard(r, pick(r, n.stock.sets), n.stock.rar, { cond: weighted(r, [["mint", 6], ["good", 3], ["worn", 1]]), normalOnly: r() < 0.8 }));
    }

}
function refreshNpcs() {

    st.lowballs = 0;
    st.shells = Math.max(st.shells, Math.round((n.shells || 0) * 0.8));
    if (n.stock && n.stock.n) {

      if (st.stock.length < n.stock.n || r() < 0.4) {
        const fresh = rollCard(r, pick(r, n.stock.sets), n.stock.rar, { cond: weighted(r, [["mint", 6], ["good", 3], ["worn", 1]]), normalOnly: r() < 0.8 });
        const keep = st.stock.filter(c => !c.story);
        if (keep.length >= n.stock.n) { const drop = keep[Math.floor(r() * keep.length)]; st.stock = st.stock.filter(c => c !== drop); }
        st.stock.push(fresh);

}
function npcNoise(npcId, sid) {
  const n = NPCS[npcId]; const r = rngFor(S.market.seed, "noise", npcId, sid, S.day);
  return 1 + (r() - 0.5) * 2 * (1 - (n.savvy ?? 0.8)) * 0.35;

function perceived(npcId, c) {
  const n = NPCS[npcId], sp = SPECIES[c.s];
  if (c.fake) return 0;
  let v;
  if (n.personality === "kid") v = cardValue({ ...c, c: "mint" }, S.island); else v = cardValue(c, S.island);
  const w = n.wants || {};
  if (w.species && w.species[c.s]) v *= w.species[c.s];
  else if (w.types && w.types[sp.type]) v *= w.types[sp.type];
  if (w.holo && c.f !== "normal") v *= w.holo;
  if (n.personality === "hoarder") v = ["R", "E", "M"].includes(sp.rarity) ? cardValue(c, S.island) * 1.05 : 0;

}
function repNeed(npcId) {

  return P.need - (rep - 50) / 500;
}
// offer: {mine:[cards], theirs:[cards], myShells, theirShells}
function evalOffer(npcId, offer) {
  const n = NPCS[npcId], P = PERSONALITY[n.personality || "fair"];
  const sv = n.shellValue || P.shellValue || 1;
  const get = offer.mine.reduce((a, c) => a + perceived(npcId, c), 0) + offer.myShells * sv;
  const give = offer.theirs.reduce((a, c) => a + perceived(npcId, c) * 1, 0) + offer.theirShells;

// What the player knows about a card's price (only what he looked up)
function knownPrice(c) {

  if (k) return { price: k.price, day: k.day, island: k.island, exact: true, fake: k.fake };
  const ks = S.knownSp[c.s];

const AUDIO = { ctx: null, master: null, music: null, musicKey: null, timer: null, step: 0 };
function audioInit() {

    AUDIO.ctx = new C(); AUDIO.master = AUDIO.ctx.createGain(); AUDIO.master.gain.value = 0.22; AUDIO.master.connect(AUDIO.ctx.destination);
    AUDIO.music = AUDIO.ctx.createGain(); AUDIO.music.gain.value = 0.35; AUDIO.music.connect(AUDIO.master);

}
function tone(freq, dur, type = "square", vol = 0.5, when = 0, dest) {

function sfx(name) {

    select: () => { tone(NOTE(76), 0.06, "square", 0.25); tone(NOTE(83), 0.08, "square", 0.25, 0.05); },
    back: () => tone(NOTE(64), 0.08, "square", 0.2),
    coin: () => { tone(NOTE(88), 0.06, "square", 0.3); tone(NOTE(93), 0.14, "square", 0.3, 0.06); },
    flip: () => { tone(NOTE(70), 0.05, "triangle", 0.4); tone(NOTE(77), 0.07, "triangle", 0.4, 0.04); },
    rip: () => { for (let i = 0; i < 6; i++) tone(200 + Math.random() * 600, 0.04, "sawtooth", 0.15, i * 0.03); },
    rare: () => [72, 76, 79, 84, 88].forEach((n, i) => tone(NOTE(n), 0.12, "square", 0.25, i * 0.07)),
    win: () => [72, 76, 79, 84, 79, 84].forEach((n, i) => tone(NOTE(n), 0.14, "square", 0.3, i * 0.11)),
    lose: () => [67, 64, 60].forEach((n, i) => tone(NOTE(n), 0.2, "triangle", 0.35, i * 0.16)),
    error: () => { tone(NOTE(50), 0.1, "square", 0.3); tone(NOTE(46), 0.15, "square", 0.3, 0.08); },

    step: () => tone(90, 0.02, "triangle", 0.15),

function playMusic(key) {

// ---------- trading ----------
const APPRAISE_COST = 10;

function offerOf(t) {
  const st = npcState(t.npc);
  const mine = S.cards.filter(c => t.mine.has(c.u));
  const theirs = st.stock.filter(c => t.theirs.has(c.u));
  return { mine, theirs, myShells: t.myShells, theirShells: t.theirShells };
}
function evalFor(t) {
  const n = NPCS[t.npc], o = offerOf(t);
  if (n.role === "con") { // a con artist prices his fakes as if they were real
    o.theirs = o.theirs.map(c => c.fake ? { ...c, fake: false } : c);
  }
  if (n.twin) { // the twins: both must be happy, so the deal is judged by the less happy twin
    const a = evalOffer("pip", o), b = evalOffer("wren", o);
    const low = a.ratio / a.need <= b.ratio / b.need ? a : b;
    return { ...low, twins: { pip: a.mood, wren: b.mood } };
  }
  return evalOffer(t.npc, o);
}

const JOBS = {

function jobDoneToday(id) { return S.jobs[id] === S.day; }
async function playJob(npcId) {
  const job = JOBS[NPCS[npcId].job];
  if (jobDoneToday(npcId)) { await say(npcId, "That's all the work I have today. Come back tomorrow!"); return; }
  const i = await ask(npcId, `${fmt(NPCS[npcId].chat[0])} Want to help? It takes a little while.`, ["Sure!", "Not now"]);
  if (i !== 0) return;

  renderHud(); saveGame(); sfx("coin");

}
function jobGame(job) {
  return new Promise(res => {
    let score = 0, misses = 0, timeLeft = 20, running = false;
    const grid = el("div", { class: "jobgrid" });
    const holes = Array.from({ length: 12 }, () => el("button", { class: "hole" }));
    holes.forEach(h => grid.append(h));
    const info = el("div", { class: "jobinfo" }, el("span", { class: "jt" }, "⏱ 20"), el("span", { class: "js" }, "0 ◈"));
    const start = el("button", { class: "btn primary big" }, "Start!");
    const body = el("div", { class: "job" }, el("p", { class: "center" }, job.tip + " (Pays up to 120 ◈.)"), info, grid, el("div", { class: "center" }, start));
    const pa = openPanel(job.title, body, { cls: "wide", noClose: true });
    const timers = [];
    holes.forEach(h => h.addEventListener("pointerdown", e => {
      e.preventDefault();
      if (!running || !h.dataset.k) return;
      if (h.dataset.k === "good") { score += 6; sfx("coin"); h.classList.add("hit"); }
      else { misses++; score = Math.max(0, score - 6); sfx("error"); h.classList.add("ouch"); }
      h.dataset.k = ""; h.textContent = "";
      setTimeout(() => h.classList.remove("hit", "ouch"), 200);
      $(".js", info).textContent = `${score} ◈`;
    }));
    const pop = () => {
      if (!running) return;
      const free = holes.filter(h => !h.dataset.k);
      if (free.length) {
        const h = pick(Math.random, free), bad = Math.random() < 0.22;
        h.dataset.k = bad ? "bad" : "good"; h.textContent = bad ? job.bad : job.item;
        timers.push(setTimeout(() => { if (h.dataset.k) { h.dataset.k = ""; h.textContent = ""; } }, 900 + Math.random() * 500));
      }
      timers.push(setTimeout(pop, 330 + Math.random() * 260));
    };
    start.addEventListener("click", () => {
      start.disabled = true; running = true; pop();
      const tick = setInterval(() => {
        timeLeft--; $(".jt", info).textContent = "⏱ " + timeLeft;
        if (timeLeft <= 0) {
          clearInterval(tick); running = false; timers.forEach(clearTimeout);
          const pay = clamp(score, 35, 120);
          start.textContent = `Done! Collect ${pay} ◈`; start.disabled = false;
          start.onclick = () => { pa.close(); res(pay); };
        }
      }, 1000);
    }, { once: true });
  });
}

  if (P.bedtime) {
    const [h, m] = P.bedtime.split(":").map(Number), mins = now.getHours() * 60 + now.getMinutes();
    if (mins >= h * 60 + m || mins < 6 * 60) return "bed";
  }
  if (P.limitMin && STORE.usage.date === todayStr() && STORE.usage.secs >= P.limitMin * 60) return "limit";
  return null;
}
function usageTick() {
  if (document.hidden || !STORE) return;
  const t = todayStr();
  if (STORE.usage.date !== t) STORE.usage = { date: t, secs: 0 };
  if (S && !$("#title").classList.contains("show")) { STORE.usage.secs++; if (STORE.usage.secs % 15 === 0) writeStore(); }
  const why = lockReason();
  const lock = $("#lockout");
  if (why && !lock.classList.contains("show")) {
    saveGame(true);
    $(".why", lock).textContent = why === "bed" ? "It's bedtime! The boats are tied up for the night." : "That's all the sailing for today!";
    lock.classList.add("show");
  } else if (!why && lock.classList.contains("show")) { lock.classList.remove("show"); document.body.classList.remove("gate-over-lock"); }
}

function downloadBackup() {
  if (S) saveGame(true);
  const blob = new Blob([JSON.stringify(STORE)], { type: "application/json" });
  const a = el("a", { href: URL.createObjectURL(blob), download: `tradewinds-backup-${todayStr()}.json` });
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 120000);
  toast("Backup file saved. On iPad it goes to the Files app, in Downloads.", "good");
}
async function restoreBackup(file, redraw) {
  if (!file) return;
  let o = null; try { o = JSON.parse(await file.text()); } catch (e) {}
  const slots = o && Array.isArray(o.slots) ? [0, 1, 2].map(i => validSave(o.slots[i]) ? o.slots[i] : null) : null;
  if (!slots || !slots.some(Boolean)) { sfx("error"); toast("That file isn't a Tradewinds backup with a saved game in it."); return; }
  o.slots = slots;
  o.backups = [0, 1, 2].map(i => Array.isArray(o.backups) && validSave(o.backups[i]) ? o.backups[i] : null);
  const list = slots.map((s, i) => s ? `Slot ${i + 1}: ${s.name}, day ${s.day}` : null).filter(Boolean).join(" · ");
  if (!(await confirmBox(`Replace the games on this device with this backup? ${list}`, "Replace", "Cancel"))) return;
  const fresh = freshStore();
  STORE = Object.assign(fresh, o, { parent: Object.assign(fresh.parent, o.parent || {}) });
  STORE.backups = STORE.backups || [null, null, null];
  S = null; SLOT = -1; writeStore();
  for (const p of UI.panels.slice()) p.close();
  $("#game").classList.remove("show"); $("#title").classList.add("show"); renderTitle();
  toast("Backup loaded!", "good");
}

// ===== 17_main.js =====
// ---------- title screen, HUD buttons, boot ----------
function renderTitle() {
  const box = $("#slots"); box.innerHTML = "";
  [0, 1, 2].forEach(i => {
    const s = validSave(STORE.slots[i]) ? STORE.slots[i] : validSave(STORE.backups[i]) ? STORE.backups[i] : null;
    box.append(el("button", { class: "slot-btn" + (s ? "" : " empty"), onclick: () => startSlot(i) },
      s ? [el("b", null, s.name), el("span", null, `Day ${s.day} · ${plural((s.stamps || []).length, "stamp")} · ${plural(s.cards.length, "card")}`), el("small", null, (ISLANDS[s.island] || ISLANDS.driftwood).name)]
        : [el("b", null, `Slot ${i + 1}`), el("span", null, "New adventure")]));
  });
}
async function startSlot(i) {
  audioInit(); sfx("select");
  if (validSave(STORE.slots[i]) || validSave(STORE.backups[i])) {
    if (!loadSlot(i)) { toast("That save couldn't be loaded."); return; }
    enterGame(false);
    if (_pendingToast) { toast(_pendingToast); _pendingToast = null; }
    return;
  }
  const name = await askName();
  if (!name) return;
  newGame(i, name);
  enterGame(true);
}
function askName() {
  return new Promise(res => {
    const input = el("input", { class: "name", maxlength: "10", placeholder: "Your name", autocomplete: "off", autocorrect: "off", spellcheck: "false" });
    let pa;
    const go = () => { const v = input.value.replace(/[^A-Za-z0-9 '\-]/g, "").trim().slice(0, 10); if (!v) { sfx("error"); input.focus(); return; } res(v); pa.close(); };
    input.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    pa = openPanel("What's your name?", el("div", { class: "confirm" }, el("p", null, "Grandpa will want to know who's using his binder."), input,
      el("div", { class: "row" }, el("button", { class: "btn primary", onclick: go }, "Start!"))), { cls: "small", onClose: () => res(null) });
    setTimeout(() => input.focus(), 50);
  });
}
async function enterGame(isNew) {
  $("#title").classList.remove("show");
  $("#game").classList.add("show");
  $("#game").classList.toggle("ledger", !!S.flags.ledger);
  loadIsland(S.island, S.x, S.y, S.dir);
  renderHud();
  if (isNew) { await sleep(400); await introOpening(); }
  else await say("ledger", `Squawk! Welcome back, ${S.name}! ${questText()}`);
  renderHud();
}
async function backToTitle() {
  saveGame(true);
  for (const p of UI.panels.slice()) p.close();
  S = null; SLOT = -1;
  $("#game").classList.remove("show");
  $("#title").classList.add("show");
  playMusic("title");
  renderTitle();
}
function openMenu() {
  if (UI.busy) return;
  openPanel("Menu", el("div", { class: "menu" },
    el("button", { class: "btn big", onclick: () => { UI.panels.at(-1).close(); openDeck(); } }, "🃏 Tide Clash deck"),
    el("button", { class: "btn big", onclick: () => { UI.panels.at(-1).close(); clashRules(); } }, "📜 How to play Tide Clash"),
    el("button", { class: "btn big", onclick: () => { UI.panels.at(-1).close(); howToPlay(); } }, "❓ How to play Tradewinds"),
    el("button", { class: "btn big", onclick: () => { saveGame(true); toast("Saved!", "good"); } }, "💾 Save now"),
    el("button", { class: "btn big", onclick: () => backToTitle() }, "🏠 Save and go to title"),
    el("button", { class: "btn big", onclick: () => openParent() }, "🔒 Grown-up settings"),
    el("p", { class: "muted small center" }, "Your game also saves by itself after everything you do.")), { cls: "small" });
}
function howToPlay() {
  openPanel("How to play", el("div", { class: "rules" },
    el("p", null, "Tap anywhere to walk there. Tap a person to talk. Tap a door or a sign to use it."),
    el("p", null, "Trade with townsfolk to fill your Binder. Every card has a price, and prices change every day. Cards from an island are cheap there and cost more on other islands."),
    el("p", null, "When you build a trade, watch the mood face. If they're not sure, they'll ask for more. Lowball someone and your reputation on that island drops."),
    el("p", null, "Trades can't be undone, so check prices first: the Exchange Board is free, and Ledger the parrot will appraise a trade for a few Shells."),
    el("p", null, "Out of Shells? Odd jobs on every island always pay. Sleep at an inn to start a new day."),
    el("p", null, "Tap the parrot button at the top any time for a hint.")), { cls: "wide" });
}
function boot() {
  loadStore();
  worldInit();
  renderTitle();
  $("#title").classList.add("show");
  $("#btn-start").addEventListener("click", () => { audioInit(); playMusic("title"); $("#title-press").classList.add("hide"); $("#slots").classList.add("show"); });
  $("#btn-grownups").addEventListener("click", () => openParent());
  $("#btn-binder").addEventListener("click", () => { if (!UI.busy) openBinder(); });
  $("#btn-journal").addEventListener("click", () => { if (!UI.busy) openJournal(); });
  $("#btn-deck").addEventListener("click", () => { if (!UI.busy) openDeck(); });
  $("#btn-menu").addEventListener("click", () => openMenu());
  $("#btn-ledger").addEventListener("click", () => ledgerTalk());
  $("#lock-grownups").addEventListener("click", async () => { document.body.classList.add("gate-over-lock"); await openParent();
    const t = setInterval(() => { if (!document.querySelector(".panel .gate, .panel .parent")) { document.body.classList.remove("gate-over-lock"); clearInterval(t); } }, 300); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) saveGame(true); });
  window.addEventListener("pagehide", () => saveGame(true));
  setInterval(usageTick, 1000);
  // title animation: little Driftlings drift across
  const deco = $("#title-deco");
  ["H1", "D1", "C1", "G1", "D10", "G13", "C6", "D7"].forEach((id, i) => deco.append(el("img", { src: driftlingURL(id), style: { animationDelay: `${-i * 2.3}s`, top: `${10 + (i * 37) % 70}%` } })));
}
window.addEventListener("DOMContentLoaded", async () => {
  await preloadStore();
  boot();
  if (window.TW_WEB) {
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
    const standalone = navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
    if (!standalone) $("#title").append(el("div", { class: "a2hs" }, el("b", null, "Grown-ups: "), "tap the Share button, then ", el("b", null, "Add to Home Screen"), ". Tradewinds then opens like an app, works offline and keeps its saves."));
  }
});

</script>
